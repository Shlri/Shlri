<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>♡ Shiri</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background">
        <div class="stars" id="stars"></div>
        <div class="floating-symbols" id="floatingSymbols"></div>
    </div>
    
    <div class="dock" id="dock">
        <div class="dock-header">☰ windows</div>
        <div class="dock-items">
            <div class="dock-item active" data-window="profile">
                <span class="dock-icon">☠</span>
                <span class="dock-label">profile</span>
            </div>
            <div class="dock-item active" data-window="links">
                <span class="dock-icon">⛓</span>
                <span class="dock-label">links</span>
            </div>
            <div class="dock-item active" data-window="interests">
                <span class="dock-icon">✝</span>
                <span class="dock-label">interests</span>
            </div>
            <div class="dock-item active" data-window="about">
                <span class="dock-icon">⚰</span>
                <span class="dock-label">about</span>
            </div>
        </div>
        <div class="dock-footer">
            <div class="status-indicator"></div>
            <span>online</span>
        </div>
    </div>
    
    <div class="windows-container" id="windowsContainer"></div>

    <script src="script.js"></script>
</body>
</html>
